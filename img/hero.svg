<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="농작물 피해 현장을 태블릿으로 조사하는 손해평가사를 그린 일러스트">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7ab8"/>
      <stop offset="55%" stop-color="#7db6dd"/>
      <stop offset="100%" stop-color="#c9e6f5"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b8" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#fff3b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c95c"/>
      <stop offset="55%" stop-color="#c9a94a"/>
      <stop offset="100%" stop-color="#a37a2c"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1420" stop-opacity=".9"/>
      <stop offset="50%" stop-color="#0b1420" stop-opacity=".62"/>
      <stop offset="100%" stop-color="#0b1420" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 하늘 -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="648" cy="112" r="130" fill="url(#sunGlow)"/>
  <circle cx="648" cy="112" r="46" fill="#ffe071"/>
  <circle cx="648" cy="112" r="32" fill="#fff6c8"/>

  <!-- 흰 구름 -->
  <g fill="#ffffff" opacity=".85">
    <ellipse cx="470" cy="86" rx="52" ry="22"/>
    <ellipse cx="432" cy="96" rx="34" ry="16"/>
    <ellipse cx="512" cy="98" rx="32" ry="15"/>
    <ellipse cx="742" cy="176" rx="44" ry="18"/>
    <ellipse cx="712" cy="184" rx="28" ry="13"/>
  </g>

  <!-- 먹구름과 우박(자연재해) -->
  <g>
    <ellipse cx="196" cy="98" rx="72" ry="31" fill="#5f7994"/>
    <ellipse cx="146" cy="112" rx="48" ry="24" fill="#4e6884"/>
    <ellipse cx="246" cy="112" rx="42" ry="21" fill="#4e6884"/>
    <g stroke="#dbeaf6" stroke-width="3" stroke-linecap="round" opacity=".85">
      <path d="M144 144l-8 20"/><path d="M180 152l-8 20"/><path d="M216 144l-8 20"/>
      <path d="M162 176l-6 15"/><path d="M200 180l-6 15"/><path d="M236 168l-6 15"/>
    </g>
    <g fill="#ffffff" opacity=".9">
      <circle cx="152" cy="204" r="3.5"/><circle cx="190" cy="216" r="3"/><circle cx="228" cy="200" r="3.5"/>
    </g>
  </g>

  <!-- 먼 산 -->
  <path d="M0 300c110-32 190 6 280-14s160-38 250-14 180 10 270-8v46H0z" fill="#5a9a63"/>
  <path d="M0 328c130-20 210 12 320-6s180-24 300-6 140 8 180 2v30H0z" fill="#427f4e"/>

  <!-- 들판 -->
  <rect x="0" y="348" width="800" height="152" fill="url(#field)"/>
  <g stroke="#8a6524" stroke-width="2" opacity=".3">
    <path d="M-40 500L300 350"/><path d="M110 500L372 350"/><path d="M270 500L444 350"/>
    <path d="M430 500L516 350"/><path d="M600 500L590 350"/><path d="M770 500L664 350"/>
  </g>
  <g fill="#8ea83f" opacity=".55">
    <path d="M0 358h800v9H0z"/><path d="M0 384h800v10H0z"/>
  </g>

  <!-- 쓰러진 작물(피해 흔적) -->
  <g stroke="#7d5a1e" stroke-width="4" stroke-linecap="round" opacity=".65">
    <path d="M64 486l26-32M100 492l20-36M140 482l28-30"/>
    <path d="M198 494l32-24M252 486l30-22"/>
  </g>

  <!-- 조사원 -->
  <g>
    <ellipse cx="648" cy="474" rx="60" ry="12" fill="#7d5a1e" opacity=".35"/>
    <rect x="628" y="398" width="17" height="72" rx="6" fill="#1d2b3f"/>
    <rect x="653" y="398" width="17" height="72" rx="6" fill="#26374d"/>
    <rect x="622" y="462" width="27" height="13" rx="5" fill="#16202e"/>
    <rect x="649" y="462" width="27" height="13" rx="5" fill="#16202e"/>
    <path d="M619 336a30 30 0 0 1 60 0v62a10 10 0 0 1-10 10h-40a10 10 0 0 1-10-10z" fill="#e8452c"/>
    <rect x="641" y="330" width="16" height="78" fill="#f7fafc"/>
    <g fill="#ffffff" opacity=".8">
      <rect x="619" y="356" width="60" height="7"/>
      <rect x="619" y="376" width="60" height="7"/>
    </g>
    <path d="M622 344c-14 6-24 16-30 28l16 10c5-9 12-16 20-20z" fill="#f7fafc"/>
    <circle cx="649" cy="300" r="21" fill="#f5cfa6"/>
    <path d="M628 296a21 21 0 0 1 42 0z" fill="#16202e"/>
    <path d="M628 296h-16a5 5 0 0 0 0 10h16z" fill="#16202e"/>
    <rect x="576" y="352" width="52" height="38" rx="5" fill="#16202e"/>
    <rect x="581" y="357" width="42" height="28" rx="3" fill="#bfe3f4"/>
    <g stroke="#16202e" stroke-width="2.5" stroke-linecap="round" opacity=".6">
      <path d="M587 378l7-8 6 5 9-11"/>
    </g>
  </g>

  <!-- 텍스트 영역 -->
  <rect width="470" height="500" fill="url(#scrim)"/>
  <text x="56" y="152" font-family="-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#ffd45e" letter-spacing="1">농어업재해</text>
  <text x="54" y="222" font-family="-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-2">손해평가사</text>
  <rect x="56" y="242" width="86" height="6" rx="3" fill="#e8452c"/>
  <g>
    <rect x="54" y="272" width="196" height="44" rx="22" fill="#e8452c"/>
    <text x="152" y="301" font-family="-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">경력 · 학력 무관</text>
  </g>
  <text x="56" y="360" font-family="-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="600" fill="#e8eff6">피해 현장을 조사하고</text>
  <text x="56" y="388" font-family="-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="600" fill="#e8eff6">보상액을 산정하는 국가공인 자격</text>
</svg>
